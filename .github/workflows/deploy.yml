name: TicketDesk CI/CD - OIDC

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build and Deploy TicketDesk
    runs-on: ubuntu-latest

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: test
      DB_USER: test
      DB_PASSWORD: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::243112136699:role/tkt-mrittika-github-actions-role
          aws-region: ap-southeast-2

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ticketdesk
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .

      - name: Push Docker image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ticketdesk
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      - name: Render ECS task definition
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: .aws/task-definition.json
          container-name: ticketdesk-api
          image: ${{ steps.login-ecr.outputs.registry }}/ticketdesk:${{ github.sha }}

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-definition.outputs.task-definition }}
          service: tkt-mrittika-tf-service
          cluster: tkt-mrittika-tf-cluster
          wait-for-service-stability: true

      - name: Find deployed load balancer
        id: find-alb
        run: |
          TARGET_GROUP_ARN=$(aws elbv2 describe-target-groups \
            --names tkt-mrittika-tf-api-tg \
            --region ap-southeast-2 \
            --query "TargetGroups[0].TargetGroupArn" \
            --output text)

          if [ -z "$TARGET_GROUP_ARN" ] || [ "$TARGET_GROUP_ARN" = "None" ]; then
            echo "Target group not found."
            exit 1
          fi

          LOAD_BALANCER_ARN=$(aws elbv2 describe-target-groups \
            --target-group-arns "$TARGET_GROUP_ARN" \
            --region ap-southeast-2 \
            --query "TargetGroups[0].LoadBalancerArns[0]" \
            --output text)

          if [ -z "$LOAD_BALANCER_ARN" ] || [ "$LOAD_BALANCER_ARN" = "None" ]; then
            echo "Load balancer not found."
            exit 1
          fi

          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --load-balancer-arns "$LOAD_BALANCER_ARN" \
            --region ap-southeast-2 \
            --query "LoadBalancers[0].DNSName" \
            --output text)

          if [ -z "$ALB_DNS" ] || [ "$ALB_DNS" = "None" ]; then
            echo "ALB DNS name not found."
            exit 1
          fi

          echo "ALB DNS: $ALB_DNS"
          echo "alb_dns=$ALB_DNS" >> "$GITHUB_OUTPUT"

      - name: Smoke test deployed API
        run: |
          URL="http://${{ steps.find-alb.outputs.alb_dns }}/health"

          echo "Testing: $URL"

          for i in {1..12}; do
            echo "Smoke test attempt $i/12"

            if curl --fail --silent --show-error --max-time 10 "$URL"; then
              echo ""
              echo "Smoke test passed."
              exit 0
            fi

            echo "Application is not ready yet. Waiting 10 seconds..."
            sleep 10
          done

          echo "Smoke test failed."
          exit 1

